<!doctype html>
<html lang="en" data-theme="light" style="color-scheme: light;"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aurel — Clothing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600&amp;family=Jost:wght@300;400;500&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#F1EFF3;--surface:#FFFFFF;--ink:#1B1722;--mute:#6C6676;--line:#D9D5DF;--acc:#3A1D4C;--onacc:#FFFFFF;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15121A;--surface:#201B28;--ink:#F0EDF3;--mute:#A29BAE;--line:#352E40;--acc:#D9C4E8;--onacc:#1B1722}}
:root[data-theme="dark"]{--bg:#15121A;--surface:#201B28;--ink:#F0EDF3;--mute:#A29BAE;--line:#352E40;--acc:#D9C4E8;--onacc:#1B1722}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:300 16px/1.6 Jost,system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
img{-webkit-user-drag:none;user-drag:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:16px clamp(20px,5vw,64px)}
.logo{font:600 26px/1 "Bodoni Moda",serif;letter-spacing:.02em}
nav{display:flex;gap:24px;align-items:center}
nav a{color:var(--mute);text-decoration:none;font-weight:400}
nav a:hover{color:var(--ink)}
.btn{background:var(--acc);color:var(--onacc);border:0;padding:12px 26px;cursor:pointer;font-weight:500;letter-spacing:.04em;text-decoration:none;display:inline-block;text-align:center}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn[disabled],.btn.off{opacity:.45;pointer-events:none}
.hero{padding:clamp(56px,11vw,150px) clamp(20px,5vw,64px) clamp(40px,7vw,90px);max-width:1400px;margin:auto}
.hero h1{font:400 clamp(44px,9vw,132px)/.95 "Bodoni Moda",serif;margin:0;letter-spacing:-.02em;max-width:11ch}
.hero p{max-width:42ch;color:var(--mute);font-size:18px;margin:32px 0}
.shop{max-width:1400px;margin:auto;padding:0 clamp(20px,5vw,64px) 100px}
.shop h2{font:400 34px/1.1 "Bodoni Moda",serif;margin:0 0 28px;display:flex;justify-content:space-between;align-items:baseline}
.shop h2 small{font:300 15px Jost;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:36px 24px}
.card{display:flex;flex-direction:column;gap:14px}
.open{background:none;border:0;padding:0;text-align:left;cursor:pointer;width:100%}
.card .btn{width:100%}
.ph{aspect-ratio:3/4;background:var(--surface);overflow:hidden}
.ph img,.sw{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s}
.card:hover .ph img,.card:hover .sw{transform:scale(1.04)}
.meta{display:flex;justify-content:space-between;gap:12px;padding-top:12px}
.nm{font-weight:400}.pr{color:var(--mute)}
.empty{border:1px dashed var(--line);padding:56px 24px;text-align:center;color:var(--mute)}
footer{border-top:1px solid var(--line);padding:32px clamp(20px,5vw,64px);color:var(--mute);font-size:14px}
.layer{position:fixed;inset:0;background:rgba(15,10,20,.6);z-index:20;display:flex;align-items:center;justify-content:center;padding:20px;animation:f .2s}
@keyframes f{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
.dlg{background:var(--bg);width:min(960px,100%);max-height:100%;overflow:auto;display:grid;grid-template-columns:1fr 1fr;position:relative}
.dlg .ph{aspect-ratio:auto;min-height:100%}
.info{padding:clamp(24px,4vw,48px);display:flex;flex-direction:column;gap:16px;justify-content:center}
.info h3{font:400 38px/1.1 "Bodoni Moda",serif;margin:0}
.x{position:absolute;top:10px;right:12px;background:var(--bg);border:0;width:38px;height:38px;font-size:22px;cursor:pointer;z-index:2}
.adm{width:min(560px,100%);display:block;padding:28px}
.adm h3{font:400 30px "Bodoni Moda",serif;margin:0 0 4px}
.fld{display:grid;gap:6px;margin:14px 0}
.fld input{background:var(--surface);border:1px solid var(--line);padding:11px 12px;width:100%}
.row{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.row .t{width:48px;height:64px;overflow:hidden;background:var(--surface)}
.row .t img,.row .t div{width:100%;height:100%;object-fit:cover}
.row .nm{font-size:15px}
.row input{grid-column:2/4;background:var(--surface);border:1px solid var(--line);padding:8px 10px;font-size:14px;width:100%}
.row button{background:none;border:0;color:var(--mute);cursor:pointer;text-decoration:underline}
.st{min-height:24px;color:var(--mute);font-size:14px}
.layer:has(.dlg.login){align-items:flex-start;justify-content:flex-end;background:rgba(15,10,20,.25);padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
.dlg.login{width:min(300px,100%);padding:18px;font-size:14px}
.dlg.login h3{font-size:20px}
.dlg.login .fld{margin:10px 0}
.dlg.login .fld input{padding:8px 10px}
.dlg.login .btn{width:100%;padding:10px}
.gal{display:flex;flex-direction:column;background:var(--surface);min-width:0}
.dlg.view{grid-template-columns:1fr;width:min(560px,100%)}
.dlg.view .gal .ph{flex:none;aspect-ratio:4/5;min-height:0;max-height:78vh}
.stage{position:relative}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;border:0;background:var(--bg);color:var(--ink);font-size:26px;line-height:1;cursor:pointer;opacity:.92;padding:0 0 3px}
.nav.prev{left:10px}.nav.next{right:10px}
.gal .ph{flex:1;min-height:320px}
.thumbs{display:flex;gap:8px;padding:10px;overflow-x:auto}
.th{width:56px;height:72px;padding:0;border:2px solid transparent;background:none;cursor:pointer;flex:none;opacity:.6}
.th.on{border-color:var(--acc);opacity:1}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.row .ap{grid-column:2/4;font-size:14px;color:var(--mute);text-decoration:underline;cursor:pointer}
@media (max-width:720px){.gal .ph{flex:none;aspect-ratio:4/5;min-height:0}}
.fld{position:relative}
#af,#ef{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.addph{display:flex;align-items:center;gap:12px;border:1.5px dashed var(--line);padding:12px 14px;cursor:pointer;background:var(--surface)}
.addph:hover{border-color:var(--acc)}
.pv{display:flex;gap:10px;flex-wrap:wrap}
.pvt{position:relative;width:56px;height:72px}
.pvt img{width:100%;height:100%;object-fit:cover;display:block}
.pvt button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);cursor:pointer;font-size:14px;line-height:1;padding:0}
.fld:has(#af:focus-visible) .addph{outline:2px solid var(--acc);outline-offset:3px}
.plus{width:30px;height:30px;border-radius:50%;background:var(--acc);color:var(--onacc);display:grid;place-items:center;font-size:22px;line-height:1}
@media (max-width:720px){.dlg{grid-template-columns:1fr}.dlg .ph{aspect-ratio:4/5;min-height:0}nav a{display:none}}
</style><style>artifact-sync,artifact-local{display:contents}</style>
<style>artifact-sync,artifact-local{display:contents}</style><style>artifact-sync,artifact-local{display:contents}</style><style>artifact-sync,artifact-local{display:contents}</style><style>artifact-sync,artifact-local{display:contents}</style><style>artifact-sync,artifact-local{display:contents}</style></head>
<body>
<header>
  <div class="logo">Aurel</div>
  <nav><a href="#shop">Collection</a><button class="btn ghost" id="adminBtn">Manage store</button></nav>
</header>
<section class="hero">
  <h1>Clothes made to last.</h1>
  <p>Considered cuts, honest fabrics and a small collection that changes slowly. Choose a piece and complete your order with our partner store.</p>
</section>
<main class="shop" id="shop"><div id="app"></div></main>
<footer>© Aurel. All pieces are sold through our partner store.</footer>
<div id="layer"></div>

<script type="application/json" id="d">{"products":[{"n":"Knit cardigan","p":"₹5,600","l":"https://ggrggr","c":["#8a6f7d","#4b3643"],"s":1}]}</script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const okUrl=u=>/^https?:\/\//i.test(u||'');
const okImg=u=>/^data:image\/(jpeg|png|webp);base64,/.test(u||'');
let P=JSON.parse($('#d').textContent).products||[];
let art=null,canEdit=false,busy=false;

const imgs=p=>(p.imgs||(p.img?[p.img]:[])).filter(okImg);
function ph(p,k=0){const a=imgs(p);return a[k]?`<img src="${a[k]}" alt="${esc(p.n)}" loading="lazy">`:`<div class="sw" style="background:linear-gradient(160deg,${esc(p.c?.[0]||'#8a8494')},${esc(p.c?.[1]||'#3a3442')})"></div>`}
function render(){
  $('#adminBtn').hidden=!canEdit;
  $('#app').innerHTML=`<h2>The collection</h2>`+
  (P.length?`<div class="grid">${P.map((p,i)=>`<div class="card"><button class="open" data-i="${i}" aria-label="View ${esc(p.n)}"><div class="ph">${ph(p)}</div><div class="meta"><span class="nm">${esc(p.n)}</span><span class="pr">${esc(p.p||'')}</span></div></button><a class="btn ${okUrl(p.l)?'':'off'}" ${okUrl(p.l)?`href="${esc(p.l)}" target="_blank" rel="noopener noreferrer"`:'aria-disabled="true"'}>Buy now</a></div>`).join('')}</div>`:`<div class="empty">New pieces are coming soon.</div>`);
}
function close(){$('#layer').innerHTML='';window.galGo=null}
function open(html,cls){const l=document.createElement('div');l.className='layer';l.innerHTML=`<div class="dlg ${cls||''}" role="dialog" aria-modal="true">${html}<button class="x" aria-label="Close">×</button></div>`;l.onclick=e=>{if(e.target===l||e.target.classList.contains('x'))close()};$('#layer').innerHTML='';$('#layer').append(l);l.querySelector('.x').focus()}
function product(i){const p=P[i];const ok=okUrl(p.l);const a=imgs(p);
  open(`<div class="gal"><div class="stage"><div class="ph" id="mainph">${ph(p)}</div>${a.length>1?`<button class="nav prev" aria-label="Previous photo">‹</button><button class="nav next" aria-label="Next photo">›</button>`:''}</div>${a.length>1?`<div class="thumbs">${a.map((s,k)=>`<button class="th${k?'':' on'}" data-k="${k}" aria-label="Photo ${k+1} of ${a.length}"><img src="${s}" alt=""></button>`).join('')}</div>`:''}</div>`,'view');let c=0;const go=k=>{c=(k+a.length)%a.length;$('#mainph').innerHTML=ph(p,c);document.querySelectorAll('.th').forEach((t,j)=>t.classList.toggle('on',j===c))};
  document.querySelectorAll('.th').forEach(b=>b.onclick=()=>go(+b.dataset.k));
  if(a.length>1){window.galGo=d=>go(c+d);document.querySelector('.nav.prev').onclick=()=>go(c-1);document.querySelector('.nav.next').onclick=()=>go(c+1);const st=document.querySelector('.stage');let x0=0;st.ontouchstart=e=>{x0=e.touches[0].clientX};st.ontouchend=e=>{const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>40)go(c+(dx<0?1:-1))}}}

function serialize(){
  const doc=document.cloneNode(true);
  doc.getElementById('d').textContent=JSON.stringify({products:P}).replace(/</g,'\\u003c');
  doc.getElementById('app').innerHTML='';doc.getElementById('layer').innerHTML='';
  return '<!doctype html>\n'+doc.documentElement.outerHTML;
}
async function save(){
  if(busy)return;busy=true;say('Publishing…');
  try{await art.publish(serialize())}
  catch(e){busy=false;say(e?.code==='conflict'?'Another edit was published first. Reload to continue.':'Couldn’t publish: '+(e?.message||'try again.'))}
}
function say(m){const s=$('#st');if(s)s.textContent=m}
function shrink(f){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.82))};im.onerror=()=>rej(new Error('Unreadable image'));im.src=u})}

function edit(i){
  const p=P[i];let cur=[...imgs(p)],add=[];
  open(`<h3>Edit piece</h3>
  <div class="fld"><label for="en">Name</label><input id="en" maxlength="80" value="${esc(p.n)}"></div>
  <div class="fld"><label for="ep">Price (optional)</label><input id="ep" maxlength="20" value="${esc(p.p||'')}"></div>
  <div class="fld"><label for="el">Buy now link</label><input id="el" type="url" value="${esc(p.l||'')}" placeholder="https://your-store.com/product"></div>
  <div class="fld"><span>Photos (up to 8)</span><div id="ev" class="pv"></div><label class="addph" for="ef"><span class="plus" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="14" height="13" rx="2"/><path d="M7 7V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><circle cx="8" cy="11.5" r="1.2"/><path d="m3 17 4-3.5 4 3.5 3-2.5"/></svg></span><span>Add photos</span></label><input id="ef" type="file" accept="image/*" multiple></div>
  <div style="display:flex;gap:10px"><button class="btn" id="es">Save changes</button><button class="btn ghost" id="ec">Back</button></div><div class="st" id="st" aria-live="polite"></div>`,'adm');
  const paint=()=>{$('#ev').innerHTML=[...cur.map((s,k)=>[s,'c',k]),...add.map((f,k)=>[URL.createObjectURL(f),'a',k])].map(([s,t,k])=>`<span class="pvt"><img src="${s}" alt=""><button type="button" data-t="${t}" data-k="${k}" aria-label="Remove photo">×</button></span>`).join('')||'<span class="pr">No photos yet.</span>';$('#ev').querySelectorAll('button').forEach(b=>b.onclick=()=>{(b.dataset.t==='c'?cur:add).splice(+b.dataset.k,1);paint()})};
  paint();
  $('#ef').onchange=()=>{add=[...add,...$('#ef').files].slice(0,Math.max(0,8-cur.length));$('#ef').value='';paint()};
  $('#ec').onclick=admin;
  $('#es').onclick=async()=>{const n=$('#en').value.trim(),l=$('#el').value.trim();if(!n)return say('Enter a name.');if(l&&!okUrl(l))return say('The link must start with http:// or https://');try{say('Preparing photos…');const more=await Promise.all(add.map(shrink));p.n=n;p.p=$('#ep').value.trim();p.l=l;p.imgs=[...cur,...more];delete p.img;await save()}catch(e){say(e.message)}};
}
function admin(){
  open(`<h3>Manage store</h3><p class="pr" style="margin:0 0 8px">Add a piece, then it goes live for every visitor.</p>
  <div class="fld"><label for="an">Name</label><input id="an" maxlength="80" placeholder="Wool overcoat"></div>
  <div class="fld"><label for="ap">Price (optional)</label><input id="ap" maxlength="20" placeholder="₹12,900"></div>
  <div class="fld"><label for="al">Buy now link</label><input id="al" type="url" placeholder="https://your-store.com/product"></div>
  <div class="fld"><span>Photos (up to 8)</span><label class="addph" for="af"><span class="plus" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="14" height="13" rx="2"/><path d="M7 7V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><circle cx="8" cy="11.5" r="1.2"/><path d="m3 17 4-3.5 4 3.5 3-2.5"/></svg></span><span id="afn">Add photos</span></label><input id="af" type="file" accept="image/*" multiple><div id="pv" class="pv"></div></div>
  <button class="btn" id="add">Add and publish</button><div class="st" id="st" aria-live="polite"></div>
  <h3 style="font-size:22px;margin-top:20px">Your pieces</h3>
  ${P.map((p,i)=>`<div class="row"><div class="t">${ph(p)}</div><span class="nm">${esc(p.n)}</span><span><button data-edit="${i}">Edit</button> <button data-del="${i}">Remove</button></span></div>`).join('')||'<p class="pr">No pieces yet.</p>'}`,'adm');
  let pend=[];
  const paint=()=>{const n=pend.length;$('#afn').textContent=n?`${n} of 8 selected · add more`:'Add photos';$('#pv').innerHTML=pend.map((f,k)=>`<span class="pvt"><img src="${URL.createObjectURL(f)}" alt=""><button type="button" data-rm="${k}" aria-label="Remove photo ${k+1}">×</button></span>`).join('');$('#pv').querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{pend.splice(+b.dataset.rm,1);paint()})};
  $('#af').onchange=()=>{pend=[...pend,...$('#af').files].slice(0,8);$('#af').value='';paint()};
  $('#add').onclick=async()=>{
    const n=$('#an').value.trim(),l=$('#al').value.trim(),fs=pend;
    if(!n)return say('Enter a name.');
    if(l&&!okUrl(l))return say('The link must start with http:// or https://');
    if(!fs.length)return say('Choose at least one photo.');
    if(fs.length>8)return say('Choose up to 8 photos.');
    try{say('Preparing photos…');const list=await Promise.all(fs.map(shrink));P.unshift({n,p:$('#ap').value.trim(),l,imgs:list});await save()}catch(e){say(e.message)}
  };
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{P.splice(+b.dataset.del,1);save()});
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(+b.dataset.edit));
  document.querySelectorAll('[data-lnk]').forEach(inp=>inp.onchange=()=>{const v=inp.value.trim();if(v&&!okUrl(v))return say('The link must start with http:// or https://');P[+inp.dataset.lnk].l=v;save()});
  document.querySelectorAll('[data-add]').forEach(inp=>inp.onchange=async()=>{const fs=[...inp.files];if(!fs.length)return;const p=P[+inp.dataset.add],cur=imgs(p);if(cur.length+fs.length>8)return say('A piece can have up to 8 photos.');try{say('Preparing photos…');p.imgs=[...cur,...await Promise.all(fs.map(shrink))];delete p.img;await save()}catch(e){say(e.message)}});
}
$('#app').addEventListener('click',e=>{const c=e.target.closest('.open');if(c)product(+c.dataset.i)});
const AH='de4bd15129a5b220d561eef908ede1c9a9617a930aae818c0fbee0ba22823016';
const unlocked=()=>{try{return sessionStorage.getItem('aurel_admin')==='1'}catch(e){return false}};
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function login(){
  open(`<h3>Admin sign in</h3><p class="pr" style="margin:0 0 8px;font-size:13px">For store admin only. Customers don’t need to sign in.</p>
  <div class="fld"><label for="lu">Username</label><input id="lu" autocomplete="username"></div>
  <div class="fld"><label for="lp">Password</label><input id="lp" type="password" autocomplete="current-password"></div>
  <button class="btn" id="lg">Sign in</button><div class="st" id="st" aria-live="polite"></div>`,'adm login');
  const go=async()=>{try{const h=await sha('aurel|'+$('#lu').value.trim()+'|'+$('#lp').value);if(h===AH){try{sessionStorage.setItem('aurel_admin','1')}catch(e){}admin()}else say('Wrong username or password.')}catch(e){say('Sign in isn’t available in this browser.')}};
  $('#lg').onclick=go;$('#lp').onkeydown=e=>{if(e.key==='Enter')go()};$('#lu').focus();
}
$('#adminBtn').onclick=()=>unlocked()?admin():login();
['contextmenu','copy','cut','dragstart','selectstart'].forEach(t=>document.addEventListener(t,e=>{if(!e.target.closest||!e.target.closest('input,textarea'))e.preventDefault()}));
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(window.galGo){if(e.key==='ArrowLeft')window.galGo(-1);if(e.key==='ArrowRight')window.galGo(1)}});
render();
(async()=>{try{if(!window.claude)return;const u=await claude.use('user');art=await claude.use('artifact');canEdit=!!(u&&u.canEdit()&&art);render()}catch(e){}})();
</script>
