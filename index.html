  function refilter(){
    if(mod<0){var d=[];for(var m=0;m<N.length;m++){d=d.concat(shuffle(all.filter(function(x){return x.m===m})).slice(0,5))}qs=d}
    else qs=shuffle(all.filter(function(x){return x.m===mod}));
  }
  function sha(t){return crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")})}
  function msg(t,k){var m=$("cmsg");if(m){m.textContent=t;m.className="cmsg "+k}}
  function applyCoupon(){var c=($("coupon").value||"").trim().toUpperCase();if(!c){msg("Enter a coupon code.","bad");return}
    try{sha(c).then(function(h){if(h===CH){coupon=true;render()}else msg("Invalid coupon code.","bad")}).catch(function(){msg("Could not check the code. Try again.","bad")})}catch(e){msg("Could not check the code. Try again.","bad")}}
  function pay(){paying=true;render()}
  function copyTxt(t,b){try{navigator.clipboard.writeText(t).then(function(){b.textContent="Copied"})}catch(e){}}
  function drawQR(){var el=$("qr");if(!el)return;if(window.QRCode){new QRCode(el,{text:LINK,width:168,height:168,colorDark:"#000000",colorLight:"#ffffff"})}else el.remove()}
  function unlock(){access=true;try{localStorage.setItem("psc-access","1")}catch(e){}refilter();i=0;render()}
  function gate(v){var f=coupon,hd='<p class="eyebrow">Full access</p>';
    if(f){v.innerHTML='<div class="card gate">'+hd+'<h2 class="gt">Unlock PSC Technical Quiz</h2><div class="price"><s>₹100</s><b>₹0</b><span class="off">FREE WITH COUPON</span></div><p class="cmsg ok" id="cmsg">Coupon applied. Your access is free.</p><div class="cta"><button class="btn gold big" id="free">Start free</button></div></div>';return}
    if(paying){
      v.innerHTML='<div class="card gate">'+hd+'<h2 class="gt">Pay ₹10 by UPI</h2>'+
      (shown?'<div class="codebox"><p>Use this code for completely free lifetime access</p><b>'+CODE+'</b><button class="btn gold big" id="usecode">Use this code</button></div>'
      :'<p class="note" style="position:relative">Scan the QR or open your UPI app, pay ₹10, then tap the button below.</p><div id="qr" class="qr"></div><p class="upi">UPI ID: <b>'+UPI+'</b> <button class="btn" id="copyid">Copy</button></p><a class="btn gold big" href="'+LINK+'">Open UPI app</a><div class="cta2"><button class="btn big" id="paid">I have paid</button></div><p class="note small"><button class="btn" id="back">← Back</button></p>')+'</div>';
      if(!shown)drawQR();return}
    v.innerHTML='<div class="card gate">'+hd+'<h2 class="gt">Unlock PSC Technical Quiz</h2>'+
    '<div class="price"><s>₹100</s><b>₹10</b><span class="off">90% OFF</span></div>'+
    '<ul class="feat"><li>1000+ questions across 10 modules</li><li>2026–27 syllabus</li><li>New question mix every turn</li><li>Instant access</li></ul>'+
    '<div class="coupon"><input type="text" id="coupon" placeholder="Coupon code" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Coupon code"><button class="btn" id="apply">Apply</button></div><p class="cmsg" id="cmsg"></p>'+
    '<div class="cta"><button class="btn gold big" id="pay">Pay ₹10</button></div><p class="note small">One-time payment · Instant access</p></div>'}
  function advance(){clearTimeout(timer);review=null;if(i===qs.length-1)finished=true;else{i++;picked=null}render()}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(all))}catch(e){}}
  function $(id){return document.getElementById(id)}
  function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}

  function render(){
    var v=$("view");document.body.classList.toggle("locked",!access);if(!access){gate(v);return}
    if(mode==="bank"){
      v.innerHTML='<div class="list">'+(qs.length?qs.map(function(x,n){
        return '<div class="row"><div><p>'+esc(x.q)+'</p><small>Module '+(x.m+1)+'. Answer: '+L[x.a]+'. '+esc(x.o[x.a])+'</small></div><button class="del" data-n="'+n+'">Delete</button></div>'
      }).join(""):'<div class="empty note">No questions yet. Select Add question to create one.</div>')+'</div>';
      return;
    }
    if(!qs.length){v.innerHTML='<div class="card"><div class="empty"><p class="q">No questions in this module</p></div></div>';return}
    if(finished){
      v.innerHTML='<div class="card"><div class="done"><p class="note">Quiz complete</p><div class="score">'+score+'/'+qs.length+'</div><p class="note">'+Math.round(score/qs.length*100)+'% correct'+(skipped?' · '+skipped+' skipped':'')+'</p><div style="margin-top:18px"><button class="btn gold" id="again">Restart quiz</button></div></div></div>';
      return;
    }
    var rv=review!==null, k=rv?review:i, x=qs[k], pk=rv?ans[k]:picked, answered=rv||picked!==null;
    var hasAns=pk!==undefined&&pk!==null&&pk>=0;
    var note=rv?(hasAns?(pk===x.a?"Your answer was correct":"Your answer: "+L[pk]+" · Correct: "+L[x.a]):"Skipped · Correct: "+L[x.a]):(answered?(picked===x.a?"Correct":"Incorrect. Correct answer: "+L[x.a]):"Select an answer");
    v.innerHTML='<div class="card"><div class="meta"><span>Question '+(k+1)+' of '+qs.length+' · Module '+(x.m+1)+'</span><span>Score '+score+(skipped?' · Skipped '+skipped:'')+'</span></div>'+
      '<div class="bar"><i style="width:'+(k/qs.length*100)+'%"></i></div>'+
      '<p class="q">'+esc(x.q)+'</p><div class="opts">'+
      x.o.map(function(t,n){
        var c="opt";if(answered){if(n===x.a)c+=" ok";else if(n===pk)c+=" bad"}
        return '<button class="'+c+'" data-n="'+n+'"'+(answered?' disabled':'')+'><b>'+L[n]+'</b><span>'+esc(t)+'</span></button>'
      }).join("")+'</div><div class="foot"><div class="fl">'+(k>0?'<button class="btn ic" id="prev" aria-label="Previous question" title="Previous">←</button>':'')+'<span class="note">'+note+'</span></div>'+
      (rv?'<button class="btn ic" id="fwd" aria-label="Next question" title="Next">→</button>':(answered?'':'<button class="btn" id="skip">'+(i===qs.length-1?"Skip and finish":"Skip")+'</button>'))+'</div></div>';
  }

  document.addEventListener("click",function(e){
    var t=e.target.closest("button");if(!t)return;
    if(t.classList.contains("opt")){picked=+t.dataset.n;ans[i]=picked;var ok=picked===qs[i].a;if(ok)score++;render();var at=i;clearTimeout(timer);timer=setTimeout(function(){if(i===at&&picked!==null)advance()},ok?900:2000)}
    else if(t.id==="apply")applyCoupon();
    else if(t.id==="pay")pay();
    else if(t.id==="paid"){shown=true;render()}
    else if(t.id==="free")unlock();
    else if(t.id==="usecode"){coupon=true;render()}
    else if(t.id==="copyid")copyTxt(UPI,t);
    else if(t.id==="back"){paying=false;shown=false;render()}
    else if(t.id==="prev"){clearTimeout(timer);review=(review===null?i:review)-1;render()}
    else if(t.id==="fwd"){review++;if(review>=i){review=null;if(picked!==null){advance();return}}render()}
    else if(t.id==="skip"){skipped++;ans[i]=-1;if(i===qs.length-1)finished=true;else{i++;picked=null}render()}
    else if(t.id==="again"){clearTimeout(timer);refilter();i=0;score=0;skipped=0;review=null;ans=[];picked=null;finished=false;render()}
    else if(t.classList.contains("del")){all.splice(all.indexOf(qs[+t.dataset.n]),1);refilter();save();i=0;score=0;picked=null;finished=false;render()}
  });

  var tb=$("theme");
  function isDark(){var r=document.documentElement;return r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches}
  function label(){tb.textContent=isDark()?"Light mode":"Dark mode"}
  tb.onclick=function(){document.documentElement.dataset.theme=isDark()?"light":"dark";label()};
  label();

  var opts=N.map(function(t,n){return '<option value="'+n+'">Module '+(n+1)+': '+t+'</option>'}).join("");
  $("mod").innerHTML='<option value="-1">All modules (50 questions, module order)</option>'+opts;
  $("mod").onchange=function(){clearTimeout(timer);mod=+this.value;refilter();i=0;score=0;skipped=0;review=null;ans=[];picked=null;finished=false;render()};
  ["copy","cut","contextmenu","dragstart","selectstart"].forEach(function(n){document.addEventListener(n,function(ev){if(ev.target&&ev.target.tagName==="INPUT")return;ev.preventDefault()})});
  document.addEventListener("keydown",function(ev){if((ev.ctrlKey||ev.metaKey)&&["c","x","a","s","p","u"].indexOf(ev.key.toLowerCase())>-1)ev.preventDefault()});
  try{access=localStorage.getItem("psc-access")==="1"}catch(e){}
  document.addEventListener("keydown",function(ev){if(ev.key==="Enter"&&ev.target&&ev.target.id==="coupon")applyCoupon()});
  refilter();
  render();
})();
</script>
</body>
</html>
